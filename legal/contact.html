<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Stock Market Hours</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <!-- Breadcrumb for navigation -->
    <nav aria-label="Breadcrumb">
        <a href="/">&larr; Back to Home</a>
    </nav>

    <div class="legal-page container" style="max-width: 800px; padding: 2rem;">
        <h1>Contact Us</h1>
        
        <section>
            <h2>Email Contact</h2>
            <p>We'd love to hear from you. Reach out using:</p>
            <div class="contact-card" style="background: #f9fafb; padding: 1.5rem; margin: 1.5rem 0; border-radius: 8px;">
                <h3>Email</h3>
                <p><strong>artem.apcommodities@gmail.com</strong></p>
                <button onclick="window.location.href='mailto:artem.apcommodities@gmail.com'" style="margin-top: 1rem; padding: 0.5rem 1rem; background: var(--color-open); color: white; border: none; border-radius: 4px; cursor: pointer;">
                    📧 Email Us Now
                </button>
            </div>
        </section>

        <section>
            <h2>Contact Form</h2>
            <form action="mailto:artem.apcommodities@gmail.com" method="post" enctype="text/plain">
                <label for="name"><strong>Name:</strong></label>
                <input type="text" id="name" name="name" style="width: 100%; padding: 0.5rem; margin-bottom: 1rem;" required>
                
                <label for="email"><strong>Email:</strong></label>
                <input type="email" id="email" name="email" style="width: 100%; padding: 0.5rem; margin-bottom: 1rem;" required>
                
                <label for="subject"><strong>Subject:</strong></label>
                <select id="subject" name="subject" style="width: 100%; padding: 0.5rem; margin-bottom: 1rem;">
                    <option value="general">General Inquiry</option>
                    <option value="feedback">Feedback</option>
                    <option value="privacy">Privacy Concern</option>
                    <option value="terms">Terms of Service Question</option>
                    <option value="other">Other</option>
                </select>
                
                <label for="message"><strong>Message:</strong></label>
                <textarea id="message" name="message" rows="5" style="width: 100%; padding: 0.5rem; margin-bottom: 1rem;" required></textarea>
                
                <button type="submit" style="padding: 0.75rem 2rem; background: var(--color-open); color: white; border: none; border-radius: 4px; cursor: pointer;">
                    Send Message
                </button>
            </form>
        </section>

        <section>
            <h2>Response Time</h2>
            <p>We typically respond within 24-48 hours. For urgent matters, please mark your email subject with "URGENT".</p>
        </section>
    </div>

    <footer class="site-footer">
        <div class="footer-content">
            <p>&copy; 2024 Global Market Tracker.</p>
        </div>
    </footer>
</body>
</html>
