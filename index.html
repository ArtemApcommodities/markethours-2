<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Market Hours - Live Global Countdown & Trading Clock</title>
    <meta name="description" content="Is the Stock Market Open? Track live world stock exchange trading hours with real-time countdowns and holiday logic in your local timezone.">
    
    <!-- JSON-LD Schema for Rich Snippets -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Global Market Clock",
      "description": "Real-time trading hours and countdowns for 30+ global stock exchanges.",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "All"
    }
    </script>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Global Market Hours</h1>
        <!-- Mid-size Ad Above the Fold -->
        <div class="ad-container ad-mid-top">
            <p class="ad-label">Advertisement</p>
            <div id="adsense-top-placeholder">
                <!-- AdSense Code Here -->
            </div>
        </div>
    </header>

    <main id="market-grid" class="grid-container">
        <!-- Cards injected by JavaScript -->
    </main>

    <footer>
        <!-- Large Display Ad -->
        <div class="ad-container ad-large-bottom">
            <p class="ad-label">Advertisement</p>
            <div id="adsense-bottom-main"></div>
        </div>
        <!-- Two Half-Size Ads -->
        <div class="ad-row">
            <div class="ad-container ad-half"><div id="adsense-bottom-left"></div></div>
            <div class="ad-container ad-half"><div id="adsense-bottom-right"></div></div>
        </div>
        
        <p>&copy; 2026 Market Hours Tracker. All Exchange Data is local time.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
