<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Market Hours - Live Global Countdown & Trading Clock</title>
    <meta name="description" content="Is the Stock Market Open? World Exchange Trading Hours & Countdown for 30 major global markets with live updates and countdown timers.">
    <link rel="canonical" href="https://your-domain.github.io/">
    
    <!-- JSON-LD Schema Markup -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebPage",
      "name": "Stock Market Hours - Live Global Countdown & Trading Clock",
      "description": "Real-time status and countdown for 30 major global stock exchanges with live local time updates.",
      "publisher": {
        "@type": "Organization",
        "name": "Global Market Tracker"
      },
      "potentialAction": {
        "@type": "SearchAction",
        "target": "{search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <!-- Legal Pages Modal Overlay -->
    <div id="legal-modal" class="modal-overlay hidden">
        <div class="modal-content" id="legal-modal-content">
            <button class="close-modal" aria-label="Close modal">&times;</button>
            <iframe src="" id="legal-iframe" frameborder="0"></iframe>
        </div>
    </div>

    <!-- Header -->
    <header class="site-header">
        <h1>Global Stock Market Hours</h1>
        <p class="subtitle">Live Trading Status • Real-time Countdowns • 30 Major Exchanges Worldwide</p>
        <nav class="legal-nav" aria-label="Legal Links">
            <a href="#" onclick="openModal('privacy')" title="Privacy Policy">📋 Privacy</a>
            <a href="#" onclick="openModal('terms')" title="Terms of Service">⚖️ Terms</a>
        </nav>
    </header>

    <!-- Ad Slot: Mid-size above fold -->
    <div id="ad-top" class="ad-slot ad-midsize"></div>

    <main class="market-container">
        <section id="exchange-grid" class="grid-container">
            <!-- Exchange cards dynamically populated here -->
        </section>
        
        <!-- Ad Slot: Display ad at bottom -->
        <div id="ad-bottom" class="ad-slot ad-display"></div>
    </main>

    <!-- Footer with Contact Link -->
    <footer class="site-footer">
        <div class="footer-content">
            <p>&copy; 2024 Global Market Tracker. All exchange information is for reference only.</p>
            <nav class="footer-nav" aria-label="Footer Navigation">
                <a href="/legal/contact.html" title="Contact Us">📧 Contact Us</a>
                <span>artem.apcommodities@gmail.com</span>
            </nav>
        </div>
    </footer>

    <!-- Legal Pages Script -->
    <script src="./js/legal-pages.js"></script>
    <script type="module" src="/js/main.js"></script>
</body>
</html>
